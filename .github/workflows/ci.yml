name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Build
        env:
          # Build-time placeholders only; real values live in the hosting provider.
          AUTH_SECRET: ci-placeholder-secret
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
        run: npm run build
